# A reusable notice script.
#
# Rather than repeating the busy-sensor wait in every automation, put it here
# once. Goes in configuration.yaml under `script:`, or in scripts.yaml.
#
# mode: queued is the point. Several automations can call it at once and the
# messages come out one after another, instead of overwriting each other -- a
# notice sent while another one plays is not queued by the clock, it is lost.
#
# Call it with:
#
#   - action: script.glance_say
#     data:
#       text: "PARCEL [icon:128]"
#       color: dark_orange
#       sound: hello

glance_say:
  alias: Say on the Glance Clock
  mode: queued
  max: 10
  fields:
    text:
      description: The message. Supports [icon:CODE].
      required: true
      selector:
        text:
    color:
      description: Palette colour name
      default: white
      selector:
        text:
    sound:
      description: Sound name, or none
      default: none
      selector:
        text:
    animation:
      description: Notice animation
      default: pulse
      selector:
        text:
  sequence:
    # Busy means the display is not idle, and a scene standing in a slot
    # counts -- verified on hardware 2026-08-12, where a running animation held
    # it on. So if you keep a progress ring or a forecast on the rings, this
    # wait never clears and every message costs twenty seconds before going out
    # anyway. Drop these three lines in that case: a notice interrupts whatever
    # is on the rings regardless, and the wait only helps against another
    # notice.
    #
    # continue_on_timeout: after twenty seconds, sending and possibly losing
    # the message beats silently doing nothing.
    - wait_template: "{{ is_state('binary_sensor.glance_clock_busy', 'off') }}"
      timeout: "00:00:20"
      continue_on_timeout: true
    - action: glance_clock.send_notice
      data:
        text: "{{ text }}"
        color: "{{ color }}"
        sound: "{{ sound }}"
        animation: "{{ animation }}"
