# Demo script version 4.
#
# The version lives in `demo_version` below and is printed in the notification
# the run leaves behind, so a film can be matched to the script that produced
# it. Bump it whenever this file changes. Version 1 is the 2026-08-12 film,
# version 2 ran about ninety seconds, version 3 was cut to a minute and proved
# too rushed to watch -- the clock's own smile face never got past its scrolling
# intro. Version 4 goes back to about ninety seconds and spends them on what is
# actually visible: the forecast faces and the clock's own faces are in, and the
# slot rotation is commented out because it did not read on film at all.
#
# Unlike its neighbours in this directory, this file is in the form the UI
# script editor wants -- it starts at `alias:` with no key above it. Paste the
# whole thing into Settings -> Automations & Scenes -> Scripts -> Add script ->
# Edit in YAML. It is meant to be run once and watched, not kept in
# scripts.yaml; add a key of your own above it if you want it there.

alias: Glance Clock - full demo and self test
description: >-
  Walks everything the integration can do, in an order that reads as a demo.
  About ninety seconds. Every wait is sized for the eye rather than for the scene
  engine, and each was measured against a film of an actual run. Each section
  has its own colour, so a still frame says which one it came from. Ends with a
  clear finale so a recording knows when to stop. Change the entity ids at the
  top to your own clock.
mode: single
icon: mdi:play-box-outline

variables:
  demo_version: "4"
  # Yours will differ. Settings -> Devices -> your clock lists them all.
  # Note run_animation and stop_animation: those entity ids were frozen before
  # the buttons were renamed to "Animation Run" and "Animation Stop", and a
  # rename does not move them.
  busy: binary_sensor.storstugan_office_glanceclock_busy
  dnd: binary_sensor.storstugan_office_glanceclock_do_not_disturb
  mute: switch.storstugan_office_glanceclock_mute
  slot_number: number.storstugan_office_glanceclock_animation_slot
  anim_select: select.storstugan_office_glanceclock_animation
  colour_select: select.storstugan_office_glanceclock_animation_colour
  factory: select.storstugan_office_glanceclock_factory_scene
  run: button.storstugan_office_glanceclock_run_animation
  stop: button.storstugan_office_glanceclock_stop_animation
  next_scene: button.storstugan_office_glanceclock_next_scene
  clear_all: button.storstugan_office_glanceclock_clear_all_scenes
  clock: notify.storstugan_office_glanceclock
  # Any weather entity with an hourly forecast.
  weather: weather.smhi_home

sequence:
  # ============ 0. Refuse to film a clock that cannot show anything =======
  # On 2026-08-12 no scene would appear at any slot while Do Not Disturb was in
  # force, and the failure is silent -- the calls all succeed. Filming that
  # wastes a take and reads as broken hardware. Stop instead, and say why.
  # A template condition rather than a state one: `condition: state` does not
  # render a template in its entity_id, so the variable above would be compared
  # as literal text and never match.
  - if:
      - condition: template
        value_template: "{{ is_state(dnd, 'on') }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Glance Clock demo not started"
          message: >-
            Do Not Disturb is in force, and scenes do not draw while it is.
            Move the quiet window off the current hour, or release the hold,
            and run this again.
      - stop: "Do Not Disturb is in force"

  - action: button.press
    target: { entity_id: "{{ clear_all }}" }
  - delay: { seconds: 2 }

  # ============ 1. The palette and the geometry ==========================
  # Four quarters, one per hour hand position. 48 pixels over 12 hours means
  # one hour is exactly 4 pixels, so these land on 12, 3, 6 and 9.
  - variables:
      t1: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.set_leds
    data:
      slot: 2
      segments:
        - { start: 0, length: 12, ring: 0, rings_tall: 4, color: red }
        - { start: 12, length: 12, ring: 0, rings_tall: 4, color: dark_orange }
        - { start: 24, length: 12, ring: 0, rings_tall: 4, color: lawn_green }
        - { start: 36, length: 12, ring: 0, rings_tall: 4, color: blue_violet }
  - delay: { seconds: 5 }

  # ============ 2. Replacing a scene in place ============================
  # Same slot, no clearing in between. Since 1.25.0 the new scene simply
  # replaces the old one and shows at once.
  - variables:
      t2: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.set_leds
    data:
      slot: 2
      segments:
        - { start: 0, length: 48, ring: 0, rings_tall: 1, color: dark_green }
        - { start: 0, length: 32, ring: 0, rings_tall: 1, color: aqua }
        - { start: 0, length: 48, ring: 2, rings_tall: 2, color: indigo }
  - delay: { seconds: 5 }

  # ============ 3. A firmware animation ==================================
  - variables:
      t3: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.set_animation
    data: { animation: fire, color: orange_red, slot: 2, speed: 4 }
  - delay: { seconds: 6 }

  # ============ 4. A scene you wrote yourself ============================
  # A comet: each step paints the head, dims the last position, and blacks out
  # the one before. Persistence is what makes it move rather than accumulate.
  #
  # Three laps rather than one. A single lap is under two seconds, and because the
  # timeline ends by painting itself black the slot then sits empty -- which
  # films as a broken clock rather than a finished animation. Erasing yourself
  # is right; being short is what makes it look wrong. Fill the window instead.
  - variables:
      t4: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.set_scene
    data:
      slot: 2
      mode: watchface
      steps:
        - seconds: 0.3
          segments:
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 0, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 8, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 16, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: white }
        - seconds: 0.3
          segments:
            - { start: 24, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: royal_blue }
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: white }
        # Sweep up after yourself, or the head and tail stay lit between runs.
        - seconds: 0.3
          segments:
            - { start: 32, length: 8, ring: 0, rings_tall: 4, color: black }
            - { start: 40, length: 8, ring: 0, rings_tall: 4, color: black }
  # Nineteen steps of 0.3 s is 5.7 s of comet. Do not wait much longer than the
  # timeline lasts, or you are filming an empty slot.
  - delay: { seconds: 6 }

  # ============ 5. An effect, which needs a fill under it ================
  - variables:
      t5: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.set_scene
    data:
      slot: 2
      mode: watchface
      steps:
        - seconds: 0.2
          segments:
            - { start: 0, length: 48, ring: 0, rings_tall: 4, color: medium_violet_red }
        - type: effect
          effect: pulse
          rise: 20
          fall: 80
          seconds: 12
          segments:
            - { start: 0, length: 48, ring: 0, rings_tall: 4, color: medium_violet_red }
  - delay: { seconds: 7 }

  # ============ 6. Weather particles, drawn by the clock =================
  - variables:
      t6: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.set_scene
    data:
      slot: 2
      mode: watchface
      steps:
        - type: weather
          condition: snow
          position: full
          intensity: 8
          seconds: 14
  - delay: { seconds: 7 }

  # ============ 7. Rain, on the clock's own forecast face ================
  # New since version 2. The dial becomes 24 hours rather than 12 here, so the
  # whole ring is tomorrow -- worth saying out loud over a film, because it
  # looks like the same geometry and is not.
  - variables:
      t7: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.send_rain_forecast
    data:
      weather_entity: "{{ weather }}"
      slot: 2
  - delay: { seconds: 7 }

  # ============ 8. Daylight, which needs no weather at all ===============
  # Arithmetic from the sun's position rather than a forecast.
  - variables:
      t8: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.send_daylight_forecast
    data:
      slot: 2
  - delay: { seconds: 7 }

  # ============ 9. The clock's own built-in faces ========================
  # Nothing of ours is on screen for this one -- this is firmware, drawn from
  # the clock's own memory, and `off` gives the dial back.
  - variables:
      t9: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.clear_leds
    data: { slot: 2 }
  - action: select.select_option
    target: { entity_id: "{{ factory }}" }
    data: { option: weather }
  - delay: { seconds: 10 }
  - action: select.select_option
    target: { entity_id: "{{ factory }}" }
    data: { option: "off" }

  # ============ 10. Several slots, and stepping between them =============
  # COMMENTED OUT ON PURPOSE. It does not read on film, so it is dead weight in
  # a recording -- but it is kept here because it works and is worth running by
  # hand. Uncomment the block, and restore `{{ t10 }}` in the closing
  # notification, to put it back.
  #
  # With more than one slot filled the clock rotates between them by itself,
  # fifteen seconds each. Nobody is filming forty-five seconds of that, so Next
  # Scene steps the rotation forward on demand. Until 1.31.0 that button was
  # called Scene Playback Start, on the belief that 31 started the scene engine.
  # It steps. See SCENES.md.
  #
  # OPEN: the stepping demonstrably happens -- the clock's own pushed slot
  # number went 4, 3, 5 on 2026-08-14, one step per press -- but watching the
  # dial during a full run of this script showed nothing changing. Whether the
  # solid rings are simply too alike to read on film, or something earlier in
  # the script leaves the display owned by another scene, is not worked out.
  # Do not take the silence for a broken button without checking that first.
  #
  # - variables:
  #     t10: "{{ now().strftime('%H:%M:%S') }}"
  # - action: glance_clock.set_leds
  #   data:
  #     slot: 3
  #     segments: [{ start: 0, length: 48, ring: 0, rings_tall: 4, color: red }]
  # - action: glance_clock.set_leds
  #   data:
  #     slot: 4
  #     segments: [{ start: 0, length: 48, ring: 0, rings_tall: 4, color: royal_blue }]
  # - action: glance_clock.set_leds
  #   data:
  #     slot: 5
  #     segments: [{ start: 0, length: 48, ring: 0, rings_tall: 4, color: lawn_green }]
  # - delay: { seconds: 2 }
  # - action: button.press
  #   target: { entity_id: "{{ next_scene }}" }
  # - delay: { seconds: 3 }
  # - action: button.press
  #   target: { entity_id: "{{ next_scene }}" }
  # - delay: { seconds: 3 }
  # - action: glance_clock.clear_leds
  #   data: { slot: 3 }
  # - action: glance_clock.clear_leds
  #   data: { slot: 4 }
  # - action: glance_clock.clear_leds
  #   data: { slot: 5 }
  # - delay: { seconds: 1 }

  # ============ 11. Something that cannot work, refused ==================
  # Invisible on film, and there on purpose: it should go red in the trace and
  # list the whole palette. continue_on_error so the finale still runs.
  - variables:
      t11: "{{ now().strftime('%H:%M:%S') }}"
  - action: glance_clock.send_notice
    continue_on_error: true
    data:
      text: "SHOULD FAIL"
      color: chartreuse

  # ============ 12. A notice, which interrupts ===========================
  - variables:
      t12: "{{ now().strftime('%H:%M:%S') }}"
  - action: notify.send_message
    target: { entity_id: "{{ clock }}" }
    data:
      title: "Delivery"
      message: "PARCEL HAS ARRIVED [sound:bells] [anim:pulse] [color:dark_magenta]"
  - delay: { seconds: 6 }

  # ============ 13. Finale: stop recording when the clock goes plain =====
  # A notice rather than a scene, deliberately. Pressing Next Scene by hand --
  # section 10 did it twice -- makes the *next* scene write wait for the scene
  # engine's next pass instead of appearing at once, up to fifteen seconds. A
  # notice does not go through that path, so the ending lands on cue.
  - variables:
      t13: "{{ now().strftime('%H:%M:%S') }}"
  - action: notify.send_message
    target: { entity_id: "{{ clock }}" }
    data:
      title: "Done"
      message: "ALL DONE [icon:134] [sound:complete] [color:lime_green]"
  - delay: { seconds: 5 }

  # Everything off. The clock returning to a plain face is the cue to stop.
  - action: button.press
    target: { entity_id: "{{ clear_all }}" }
  - delay: { seconds: 1 }

  - action: persistent_notification.create
    data:
      title: "Glance Clock demo (script v{{ demo_version }})"
      message: >-
        1 palette {{ t1 }} · 2 replace in place {{ t2 }} · 3 firmware animation
        {{ t3 }} · 4 comet {{ t4 }} · 5 pulse {{ t5 }} · 6 snow {{ t6 }} ·
        7 rain forecast {{ t7 }} · 8 daylight {{ t8 }} · 9 factory face {{ t9 }} ·
        10 slot rotation {{ t10 | default('off') }} · 11 refused {{ t11 }} ·
        12 notice {{ t12 }} · 13 finale {{ t13 }}.

        Sensors: busy={{ states(busy) }}, dnd={{ states(dnd) }},
        muted={{ states(mute) }}, slot={{ states(slot_number) }}.

        {% if is_state(mute, 'on') %}NOTE: the clock is muted, so sections 12
        and 13 were silent. That is the Mute switch, not a missing sound.{% endif %}
