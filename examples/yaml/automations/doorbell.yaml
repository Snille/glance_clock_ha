# A doorbell that is worth hearing.
#
# max_exceeded: silent keeps the log clean when someone leans on the button.
#
# The examples are in English, but the font is worth knowing about if yours
# will not be: the matrix is ASCII only. Accented letters are transliterated --
# å and ä become a, ö becomes o -- and anything with no glyph at all is drawn as
# a visible box rather than dropped, so a mangled string looks wrong instead of
# looking fine. See SCENES.md on the font.

alias: Doorbell on the clock
description: Announce the doorbell immediately, as a notice rather than a scene
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_doorbell
    to: "on"
actions:
  - action: glance_clock.send_notice
    data:
      text: "FRONT DOOR [icon:128]"
      animation: pulse
      color: dark_orange
      sound: bells
      priority: high
mode: single
max_exceeded: silent
