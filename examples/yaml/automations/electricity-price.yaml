# Electricity price as a colour on the inner ring.
#
# Not an arc but a whole ring, tinted by how expensive the hour is. Ambient
# information you read without thinking about it.
#
# Mind the whitespace in that template: a `>` block keeps the newline out, but
# the leading spaces on each branch survive. The integration strips and
# lowercases colour names, so it works. If you write your own resolver
# elsewhere, it will not.

alias: Electricity price ring
description: Tint the innermost ring by the current price
triggers:
  - trigger: state
    entity_id: sensor.electricity_price
  - trigger: homeassistant
    event: start
actions:
  - variables:
      price: "{{ states('sensor.electricity_price') | float(0) }}"
  - action: glance_clock.set_leds
    data:
      slot: 5
      mode: watchface
      segments:
        - start: 0
          length: 48
          ring: 3
          color: >
            {% if price < 0.5 %}dark_green
            {% elif price < 1.0 %}olive
            {% elif price < 2.0 %}dark_orange
            {% else %}red{% endif %}
mode: single
